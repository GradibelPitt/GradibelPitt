name: Generate Snake

on:
  schedule:
    # Daily at 18:17 UTC; avoid the busiest start-of-hour window.
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Keep snake inside contribution grid
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              cells = [(float(x), float(y)) for x, y in re.findall(
                  r'<rect class="c(?: [^"]*)?" x="([^"]+)" y="([^"]+)"', svg
              )]
              snake = re.search(r'((?:<rect class="s[^"]*"[^>]*/>)+)</svg>\s*$', svg)
              if not cells or not snake:
                  raise ValueError(f"Unexpected snake SVG structure: {path}")

              left = min(x for x, _ in cells) - 2
              top = min(y for _, y in cells) - 2
              width = max(x for x, _ in cells) - left + 14
              height = max(y for _, y in cells) - top + 14
              clip = (f'<defs><clipPath id="snake-grid-clip" clipPathUnits="userSpaceOnUse">'
                      f'<rect x="{left:g}" y="{top:g}" width="{width:g}" height="{height:g}"/>'
                      f'</clipPath></defs>')
              svg = svg[:snake.start()] + clip + '<g clip-path="url(#snake-grid-clip)">' + snake.group(1) + '</g>' + svg[snake.end(1):]
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

